name: Notebook validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-validation:
    name: Dependencies, notebook syntax, and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Validate notebook and published assets
        run: python scripts/validate_notebook.py
